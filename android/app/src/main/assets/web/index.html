<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BT 下载器</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; background:#0f172a; color:#e2e8f0; min-height:100vh; padding:20px; }
  .container { max-width:760px; margin:0 auto; }
  h1 { font-size:22px; margin-bottom:4px; }
  .subtitle { color:#94a3b8; font-size:13px; margin-bottom:20px; }
  .add-card { background:#1e293b; border-radius:14px; padding:20px; margin-bottom:20px; }
  .tabs { display:flex; gap:8px; margin-bottom:14px; }
  .tab { padding:8px 16px; border-radius:8px; cursor:pointer; font-size:13px; background:#334155; border:none; color:#e2e8f0; }
  .tab.active { background:#3b82f6; }
  .panel { display:none; }
  .panel.active { display:block; }
  input[type=text], textarea {
    width:100%; padding:10px 12px; border-radius:8px; border:1px solid #475569;
    background:#0f172a; color:#e2e8f0; font-size:14px; font-family:inherit;
  }
  textarea { min-height:60px; resize:vertical; }
  .btn { padding:10px 20px; border-radius:8px; border:none; background:#3b82f6; color:#fff; font-size:14px; cursor:pointer; margin-top:10px; }
  .btn:hover { background:#2563eb; }
  .btn-secondary { background:#334155; }
  .btn-secondary:hover { background:#475569; }
  .file-label { display:inline-block; padding:10px 20px; border-radius:8px; background:#334155; cursor:pointer; font-size:14px; }
  .file-label:hover { background:#475569; }
  #fileInput { display:none; }
  .fileName { margin-left:12px; color:#94a3b8; font-size:13px; }
  .dl-card { background:#1e293b; border-radius:12px; padding:16px; margin-bottom:12px; }
  .dl-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .dl-name { font-size:14px; font-weight:600; word-break:break-all; flex:1; margin-right:10px; }
  .dl-remove { background:#dc2626; color:#fff; border:none; border-radius:6px; padding:4px 10px; cursor:pointer; font-size:12px; }
  .dl-remove:hover { background:#b91c1c; }
  .pbar { height:18px; background:#334155; border-radius:9px; overflow:hidden; position:relative; margin:8px 0; }
  .pfill { height:100%; background:linear-gradient(90deg,#22d3ee,#3b82f6); border-radius:9px; transition:width .3s; width:0%; }
  .ptext { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; text-shadow:0 1px 2px rgba(0,0,0,.5); }
  .dl-stats { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:#94a3b8; margin-top:6px; }
  .dl-stats span b { color:#e2e8f0; }
  .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:600; }
  .b-downloading { background:#1d4ed8; color:#bfdbfe; }
  .b-finished { background:#15803d; color:#bbf7d0; }
  .b-seeding { background:#7c3aed; color:#ddd6fe; }
  .b-checking { background:#ca8a04; color:#fef08a; }
  .b-error { background:#dc2626; color:#fecaca; }
  .b-queued { background:#475569; color:#cbd5e1; }
  .empty { text-align:center; color:#64748b; padding:40px; font-size:14px; }
  .pulse { animation:pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
  /* 高级设置折叠 */
  .adv-toggle { display:flex; align-items:center; gap:6px; color:#64748b; font-size:12px; cursor:pointer; margin-top:10px; user-select:none; }
  .adv-toggle:hover { color:#94a3b8; }
  .adv-toggle .caret { transition:transform .2s; font-size:10px; }
  .adv-toggle.open .caret { transform:rotate(90deg); }
  .adv { display:none; margin-top:12px; gap:10px; flex-direction:column; }
  .adv.open { display:flex; }
  .adv label { font-size:11px; color:#64748b; text-transform:uppercase; letter-spacing:.5px; }
  .adv .row { display:flex; flex-direction:column; gap:4px; }
  .hint { font-size:11px; color:#64748b; margin-top:4px; }
  .path-bar { background:#1e293b; border-radius:14px; padding:14px 20px; margin-bottom:14px; }
  .path-label { font-size:11px; color:#64748b; text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px; }
  .path-row { display:flex; gap:10px; align-items:center; }
  .path-text {
    flex:1; padding:10px 12px; border-radius:8px; border:1px solid #475569;
    background:#0f172a; color:#94a3b8; font-size:13px; word-break:break-all;
    min-height:40px; display:flex; align-items:center;
  }
  .path-btn { margin-top:0; flex-shrink:0; }
  .path-btn:disabled { opacity:.55; cursor:default; }
</style>
</head>
<body>
<div class="container">
  <h1>🌀 BT 下载器</h1>
  <div class="subtitle">支持 .torrent / 磁力链接 / HTTP 直链（可带 Cookie）</div>

  <div class="path-bar">
    <div class="path-label">下载路径</div>
    <div class="path-row">
      <div class="path-text" id="dlPath">加载中...</div>
      <button class="btn btn-secondary path-btn" id="pickBtn" onclick="pickDir()">浏览</button>
    </div>
  </div>

  <div class="add-card">
    <div class="tabs">
      <button class="tab active" data-tab="magnet">链接</button>
      <button class="tab" data-tab="file">种子文件</button>
    </div>
    <div class="panel active" id="panel-magnet">
      <input type="text" id="magnetInput" placeholder="magnet:?xt=urn:btih:... 或 https://...">
      <div class="adv-toggle" onclick="toggleAdv()"><span class="caret">▶</span>高级设置（Headers / Cookie）</div>
      <div class="adv" id="adv">
        <div class="row">
          <label>Cookie（网盘鉴权用）</label>
          <textarea id="cookies" placeholder="paste cookie here..."></textarea>
          <div class="hint">从浏览器 DevTools → Network → 复制 cookie 请求头的值</div>
        </div>
        <div class="row">
          <label>自定义 Headers（每行 Key: Value）</label>
          <textarea id="headers" placeholder="Referer: https://pan.baidu.com&#10;User-Agent: Mozilla/5.0 ..."></textarea>
        </div>
      </div>
      <button class="btn" onclick="addLink()">开始下载</button>
    </div>
    <div class="panel" id="panel-file">
      <label class="file-label" for="fileInput">选择 .torrent 文件</label>
      <input type="file" id="fileInput" accept=".torrent" onchange="onFileChange(event)">
      <span class="fileName" id="fileName"></span>
      <button class="btn" id="uploadBtn" onclick="uploadTorrent()" style="display:none;">开始下载</button>
    </div>
  </div>

  <div id="list"></div>
</div>

<script>
const stateMap = {"queued":"排队中","checking":"校验中","downloading metadata":"下载元数据","downloading":"下载中","finished":"已完成","seeding":"做种中","allocating":"分配中","checking fastresume":"校验中"};
const badgeMap = {"downloading":"b-downloading","finished":"b-finished","seeding":"b-seeding","checking":"b-checking","error":"b-error","queued":"b-queued","checking fastresume":"b-checking","downloading metadata":"b-downloading"};

document.querySelectorAll('.tab').forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('panel-'+t.dataset.tab).classList.add('active');
  };
});

function toggleAdv(){
  const t = document.querySelector('.adv-toggle');
  const p = document.getElementById('adv');
  t.classList.toggle('open');
  p.classList.toggle('open');
}

function fmtBytes(b){
  if(b<=0) return "0 B";
  const u=["B","KB","MB","GB","TB"];
  let i=Math.floor(Math.log(b)/Math.log(1024));
  return (b/Math.pow(1024,i)).toFixed(2)+" "+u[i];
}
function fmtRate(b){ return fmtBytes(b)+"/s"; }

let selectedFile=null;
function onFileChange(e){
  selectedFile=e.target.files[0];
  document.getElementById('fileName').textContent=selectedFile?selectedFile.name:"";
  document.getElementById('uploadBtn').style.display=selectedFile?"inline-block":"none";
}

async function loadConfig(){
  try{
    const r=await fetch("/api/config");
    const d=await r.json();
    if(d.download_dir) document.getElementById("dlPath").textContent=d.download_dir;
  }catch(e){
    document.getElementById("dlPath").textContent="无法读取下载路径";
  }
}

async function pickDir(){
  const btn=document.getElementById("pickBtn");
  btn.disabled=true;
  try{
    const r=await fetch("/api/pick-dir",{method:"POST"});
    const d=await r.json();
    if(d.ok && d.download_dir) document.getElementById("dlPath").textContent=d.download_dir;
    else if(!d.cancelled && d.error) alert(d.error);
  }catch(e){
    alert("选择目录失败");
  }finally{
    btn.disabled=false;
  }
}

async function addLink(){
  const v=document.getElementById('magnetInput').value.trim();
  if(!v){ alert("请输入链接"); return; }
  const payload = { magnet: v };
  const cookies = document.getElementById('cookies').value.trim();
  const headers = document.getElementById('headers').value.trim();
  if (cookies) payload.cookies = cookies;
  if (headers) payload.headers = headers;
  const r=await fetch("/api/add",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
  const d=await r.json();
  if(d.ok){ document.getElementById('magnetInput').value=""; refresh(); }
  else alert("添加失败: "+(d.error||"未知错误"));
}

async function uploadTorrent(){
  if(!selectedFile) return;
  const fd=new FormData();
  fd.append("file",selectedFile);
  const r=await fetch("/api/upload",{method:"POST",body:fd});
  const d=await r.json();
  if(d.ok){ selectedFile=null; document.getElementById('fileName').textContent=""; document.getElementById('uploadBtn').style.display="none"; document.getElementById('fileInput').value=""; refresh(); }
  else alert("添加失败: "+(d.error||"未知错误"));
}

async function removeTask(id){
  if(!confirm("确定删除此下载任务？已下载的文件不会被删除。")) return;
  await fetch("/api/remove?id="+encodeURIComponent(id),{method:"POST"});
  refresh();
}

async function refresh(){
  try{
    const r=await fetch("/api/list");
    const d=await r.json();
    const list=document.getElementById('list');
    if(d.downloads.length===0){ list.innerHTML='<div class="empty">暂无下载任务</div>'; return; }
    list.innerHTML=d.downloads.map(t=>{
      const pct=(t.progress*100).toFixed(2);
      const st=t.state||"queued";
      const cls=badgeMap[st]||"b-queued";
      const pulse=st==="downloading"?"pulse":"";
      return `<div class="dl-card">
        <div class="dl-head">
          <div class="dl-name">${t.name}</div>
          <span class="badge ${cls} ${pulse}">${stateMap[st]||st}</span>
          <button class="dl-remove" onclick="removeTask('${t.id}')">删除</button>
        </div>
        <div class="pbar"><div class="pfill" style="width:${pct}%"></div><div class="ptext">${pct}%</div></div>
        <div class="dl-stats">
          <span>⬇️ <b>${fmtRate(t.download_rate||0)}</b></span>
          <span>⬆️ <b>${fmtRate(t.upload_rate||0)}</b></span>
          ${t.num_seeds!==undefined?`<span>🌱 <b>${t.num_seeds||0}</b></span>`:""}
          ${t.num_peers!==undefined?`<span>🔗 <b>${t.num_peers||0}</b></span>`:""}
          <span>📦 <b>${fmtBytes(t.total_download||0)}</b>${t.total_size?(" / "+fmtBytes(t.total_size)):""}</span>
        </div>
      </div>`;
    }).join('');
  }catch(e){}
}
loadConfig();
refresh();
setInterval(refresh,2000);
</script>
</body>
</html>
